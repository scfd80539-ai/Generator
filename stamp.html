<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F62E3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='20' fill='%23FFCF1A' stroke='%2308080E' stroke-width='7'/%3E%3Cpolygon points='50,20 58.8,40.5 81,42 64,56.5 69.4,78 50,66.3 30.6,78 36,56.5 19,42 41.2,40.5' fill='%23fff' stroke='%2308080E' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>蓋章集點本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: an arena menu — striped blue backdrop, a row of kid cards like a character select, the current card as a trophy track of tilted tokens, a purple reward screen for full cards, then the record log */
:root{
  color-scheme:dark;
  --bg-hi:#45A3FF; --bg:#1F62E3; --bg-lo:#0C2C98;
  --line:#08080E;
  --panel:#10307A; --panel-2:#1B4394; --panel-3:#0A2260;
  --fg:#FFFFFF; --muted:#B4CAF3; --dim:#7088BD;
  --yellow:#FFCF1A; --yellow-hi:#FFF27A; --yellow-dk:#D98C00;
  --blue:#38A0FF; --blue-hi:#A3D8FF; --blue-dk:#155BD0;
  --red:#FF4747; --red-hi:#FFA39C; --red-dk:#C21F1F;
  --purple:#9D46FF; --purple-hi:#D6A8FF; --purple-dk:#5715B5;
  --green:#3FCF55;
  --chip-hi:#6F92D6; --chip:#4466AC; --chip-dk:#2B4886;
  --gray-hi:#C9D6EC; --gray:#8EA3C6; --gray-dk:#5A6E93;
  --ink-red:#FF4747; --ink-blue:#2FA0FF; --ink-green:#3FD45A; --ink-purple:#A64DFF; --ink-orange:#FF8C1A; --ink-pink:#FF5CB0;
  --ol:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),1.4px 1.4px 0 var(--line),-1.4px 1.4px 0 var(--line),1.4px -1.4px 0 var(--line),-1.4px -1.4px 0 var(--line),0 3.5px 0 var(--line);
  --ol3:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),2.1px 2.1px 0 var(--line),-2.1px 2.1px 0 var(--line),2.1px -2.1px 0 var(--line),-2.1px -2.1px 0 var(--line),0 5px 0 var(--line);
  --ol1:1px 0 0 var(--line),-1px 0 0 var(--line),0 1px 0 var(--line),0 -1px 0 var(--line),0 2px 0 var(--line);
  --icon-ol:drop-shadow(1.8px 0 0 var(--line)) drop-shadow(-1.8px 0 0 var(--line)) drop-shadow(0 1.8px 0 var(--line)) drop-shadow(0 -1.8px 0 var(--line));
  --icon-ol-sm:drop-shadow(1px 0 0 var(--line)) drop-shadow(-1px 0 0 var(--line)) drop-shadow(0 1px 0 var(--line)) drop-shadow(0 -1px 0 var(--line));
  --font-num:"Lilita One","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#1F62E3}
html,body{margin:0}
img{max-width:100%}

/* sign-in + settings */
.signin .intro-body p{color:#FFFFFF}
.signin .who{font-weight:900;color:var(--yellow)}
.settings{display:grid;gap:12px;padding:14px 16px 16px;border-radius:16px;border:2px solid var(--line);background:rgba(4,12,40,.55);font-size:13px;color:var(--muted)}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.settings-row b{color:#FFFFFF}
.settings .row-act{justify-content:flex-start;padding-left:6px}
.settings .confirm{display:grid;gap:10px;padding:10px 12px;border-radius:10px;border:2px solid var(--yellow);background:rgba(0,0,0,.3);color:#FFFFFF;font-weight:700}
body{
  background-color:var(--bg);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 22px,rgba(255,255,255,0) 22px 44px),radial-gradient(ellipse at 50% 0%,var(--bg-hi),var(--bg) 45%,var(--bg-lo) 100%);
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100%
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

.top{max-width:700px;margin:0 auto;padding-inline:16px;padding-block:22px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin:0;font-weight:900;font-size:clamp(28px,8vw,38px);line-height:1.15;letter-spacing:.03em;color:#FFFFFF;text-shadow:var(--ol3);transform:rotate(-2deg)}
.brand .token{width:46px;height:46px;--ink:var(--yellow);--rot:-8deg}
.hud-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-left:4px}
.snd{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:3px 14px;border:none;background:none;color:#FFFFFF;text-shadow:var(--ol1);font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap}
.snd::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-9deg);border:2px solid var(--line);border-radius:8px;background:rgba(4,12,40,.6);box-shadow:0 3px 0 var(--line)}
.snd[aria-pressed="true"]{text-shadow:var(--ol)}
.snd[aria-pressed="true"]::before{background:linear-gradient(var(--yellow-hi),var(--yellow) 55%,var(--yellow-dk))}
.snd svg{width:18px;height:18px;color:#FFFFFF;filter:var(--icon-ol-sm)}
.snd[aria-pressed="false"] svg{opacity:.55}
.snd:active{transform:translateY(2px)}
.status{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:rgba(4,12,40,.6);color:#FFFFFF;font-size:12px;font-weight:700}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.status[data-k="ok"] .dot{background:var(--green)}
.status[data-k="warn"] .dot{background:var(--red)}

.wrap{max-width:700px;margin:0 auto;padding-inline:16px;padding-block:12px 100px;display:grid;gap:20px}
#view{display:grid;gap:22px;min-width:0}

/* tokens */
.token{position:relative;display:grid;place-items:center;border:3px solid var(--line);border-radius:22%;
  background:radial-gradient(circle at 50% 26%,rgba(255,255,255,.5),rgba(255,255,255,0) 58%),var(--ink,var(--ink-blue));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--line);transform:rotate(var(--rot,0deg))}
.token svg{width:64%;height:64%;color:#FFFFFF;filter:var(--icon-ol)}
.token.sm{border-width:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--line)}
.token.sm svg{filter:var(--icon-ol-sm)}

/* character-select roster */
.roster{display:flex;gap:14px;overflow-x:auto;padding:10px 6px 14px;scrollbar-width:thin}
.bcard{flex:none;position:relative;width:112px;height:146px;padding:0;border:3px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 10px,rgba(255,255,255,0) 10px 20px),radial-gradient(circle at 50% 38%,rgba(255,255,255,.5),rgba(255,255,255,0) 62%),var(--ink,var(--ink-blue));
  box-shadow:0 4px 0 var(--line);transition:transform .15s ease}
.bcard[aria-current="true"]{transform:translateY(-4px);box-shadow:0 0 0 4px var(--yellow),0 8px 0 var(--line)}
.bcard:active{transform:translateY(1px)}
.bcard-icon{position:absolute;left:50%;top:45%;width:64px;height:64px;transform:translate(-50%,-50%) rotate(-7deg)}
.bcard-icon svg{width:100%;height:100%;color:#FFFFFF;filter:var(--icon-ol)}
.bcard-tro{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:3px;padding:0 8px 0 3px;border-radius:999px;background:rgba(0,0,0,.62);font-family:var(--font-num);font-size:15px;line-height:22px;color:#FFFFFF;font-variant-numeric:tabular-nums}
.bcard-tro svg{width:18px;height:18px;color:var(--yellow);filter:var(--icon-ol-sm)}
.bcard-alert{position:absolute;top:5px;right:5px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);background:var(--red);color:#FFFFFF;font-family:var(--font-num);font-size:16px;line-height:1;text-shadow:var(--ol1)}
.bcard-name{position:absolute;left:0;right:0;bottom:0;padding:5px 6px 6px;border-top:3px solid var(--line);background:rgba(0,0,0,.55);font-weight:900;font-size:15px;line-height:1.35;color:#FFFFFF;text-shadow:var(--ol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard.add{display:grid;align-content:center;justify-items:center;gap:2px;background:rgba(4,12,40,.35);border:3px dashed rgba(255,255,255,.55);box-shadow:none;color:#FFFFFF;font-weight:900;font-size:13px}
.bcard-plus{font-family:var(--font-num);font-size:44px;line-height:1;text-shadow:var(--ol)}

/* panels */
.panel{background:linear-gradient(var(--panel-2),var(--panel));border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);min-width:0;overflow:hidden;color:var(--fg)}
.ribbon{position:relative;padding:12px 16px 14px;border-bottom:3px solid var(--line);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 60%),var(--ink,var(--blue))}
.card-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.card-title{min-width:0}
.tag{display:inline-block;transform:skewX(-10deg);padding:0 10px;border:2px solid var(--line);background:var(--yellow);color:var(--line);font-size:12px;font-weight:900;line-height:20px;letter-spacing:.06em}
.kid-name{margin:6px 0 0;font-weight:900;font-size:clamp(28px,7.5vw,38px);line-height:1.15;color:#FFFFFF;text-shadow:var(--ol3);text-wrap:balance;overflow-wrap:anywhere}
.tally{display:flex;align-items:center;gap:6px;font-family:var(--font-num);line-height:1;color:#FFFFFF;text-shadow:var(--ol3);white-space:nowrap}
.tally svg{width:40px;height:40px;color:var(--yellow);filter:var(--icon-ol);margin-right:2px}
.tally-n{font-size:clamp(38px,10vw,50px);font-variant-numeric:tabular-nums}
.tally-of{font-size:24px}
.badge{position:absolute;top:12px;right:14px;transform:skewX(-10deg);padding:0 10px;border:2px solid var(--line);background:var(--yellow);color:var(--line);font-size:12px;font-weight:900;line-height:20px;letter-spacing:.08em}
.card-body{padding:18px clamp(14px,4vw,22px) 24px}
.card.sample .grid{pointer-events:none}

.xp-wrap{position:relative;height:34px;margin-inline:6px}
.xp{position:absolute;inset:0;transform:skewX(-14deg);border:3px solid var(--line);border-radius:7px;background:var(--panel-3);overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.4),0 3px 0 var(--line)}
.xp-fill{height:100%;background:linear-gradient(var(--yellow-hi),var(--yellow) 55%,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5);transition:width .5s ease}
.xp-text{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-size:19px;color:#FFFFFF;text-shadow:var(--ol);font-variant-numeric:tabular-nums}
.goal-line{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.goal-line b{color:#FFFFFF;font-weight:900}

.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,62px));justify-content:center;gap:30px clamp(8px,2.4vw,14px);margin-top:24px}
.slot{position:relative;isolation:isolate;aspect-ratio:1;max-width:100%;border-radius:22%;border:3px solid rgba(0,0,0,.5);background:rgba(4,14,48,.55);box-shadow:inset 0 4px 0 rgba(0,0,0,.35);padding:0;display:grid;place-items:center;color:var(--dim);font-family:var(--font-num);font-size:clamp(15px,3.8vw,21px);font-variant-numeric:tabular-nums}
.slot.next{border:3px solid var(--line);background:linear-gradient(var(--yellow-hi),var(--yellow) 55%,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--line);color:#FFFFFF;text-shadow:var(--ol);font-size:clamp(26px,6.5vw,36px);cursor:pointer;animation:bob 1.5s ease-in-out infinite}
.slot.goal{border:3px solid var(--line);background:radial-gradient(circle at 50% 32%,var(--purple-hi),var(--purple) 55%,var(--purple-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--line)}
.slot.goal svg{width:68%;height:68%;color:var(--yellow);filter:var(--icon-ol)}
.slot.filled{border:none;background:none;box-shadow:none;cursor:pointer}
.slot .token{position:absolute;inset:0}
.slot.filled.sel .token{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),0 0 0 4px #FFFFFF,0 0 0 7px var(--line)}
.slot .d{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);font-family:var(--font-body);font-size:11px;font-weight:700;line-height:1.3;color:var(--muted);white-space:nowrap}
@keyframes bob{50%{transform:translateY(-4px)}}
.token.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{transform:scale(2.4) rotate(calc(var(--rot,0deg) - 25deg));opacity:0}60%{transform:scale(.9) rotate(var(--rot,0deg));opacity:1}100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1}}
.rays{position:absolute;inset:-70%;z-index:-1;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,226,74,.9) 0 9deg,rgba(255,226,74,0) 9deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 22%,transparent 68%);mask-image:radial-gradient(circle,#000 22%,transparent 68%);
  animation:rays 1.3s ease-out both}
@keyframes rays{0%{opacity:0;transform:scale(.4) rotate(0deg)}25%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(70deg)}}
.plus{position:absolute;left:50%;top:-18px;z-index:2;transform:translateX(-50%);font-family:var(--font-num);font-size:28px;color:var(--yellow);text-shadow:var(--ol);pointer-events:none;animation:plus 1.2s ease-out .3s both}
@keyframes plus{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-42px) scale(1)}}

.detail{margin-top:30px;padding:12px 16px 14px;border-radius:12px;background:var(--panel-3);border:3px solid var(--line)}
.detail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:17px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0}
.detail dt{color:var(--muted);font-size:13px;font-weight:700;padding-top:2px}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:500}
.sig-big{display:block;width:180px;max-width:100%;height:auto;color:#FFFFFF;margin-top:2px}

/* reward screen */
.done-card{position:relative;isolation:isolate;overflow:hidden;display:grid;gap:12px;width:100%;text-align:left;padding:16px clamp(14px,4vw,22px) 20px;border:3px solid var(--line);border-radius:18px;
  background:radial-gradient(circle at 50% 30%,var(--purple-hi),var(--purple) 45%,var(--purple-dk));color:#FFFFFF;box-shadow:0 5px 0 var(--line);font:inherit;cursor:pointer}
.done-card::before{content:"";position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:-1;background:repeating-conic-gradient(rgba(255,255,255,.14) 0 9deg,rgba(255,255,255,0) 9deg 18deg);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
section.done-card{cursor:default}
button.done-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.done-head{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.done-flag{font-weight:900;font-size:clamp(24px,6.5vw,30px);line-height:1.25;color:var(--yellow);text-shadow:var(--ol3)}
.mini-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,34px));gap:8px 6px;justify-content:start}
.mini-grid .token{aspect-ratio:1;max-width:100%}
.done-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;color:#FFFFFF;text-shadow:var(--ol1)}
.done-foot b{color:var(--yellow);font-weight:900}
.done-cta{position:relative;isolation:isolate;display:inline-flex;align-items:center;min-height:50px;padding:6px 28px;color:#FFFFFF;text-shadow:var(--ol);font-weight:900;font-size:18px;animation:pulse 1.3s ease-in-out infinite}
.done-cta::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-10deg);border:3px solid var(--line);border-radius:10px;background:linear-gradient(var(--yellow-hi),var(--yellow) 55%,var(--yellow-dk));box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--line)}
@keyframes pulse{50%{transform:scale(1.07)}}
.done-wait{font-weight:900;color:var(--yellow)}

/* buttons */
.actions{display:flex;gap:14px;flex-wrap:wrap;padding-inline:6px}
.btn{--b1:var(--gray-hi);--b2:var(--gray);--b3:var(--gray-dk);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 24px;border:none;background:none;color:#FFFFFF;text-shadow:var(--ol);font-weight:900;cursor:pointer}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-9deg);border:3px solid var(--line);border-radius:10px;background:linear-gradient(var(--b1),var(--b2) 55%,var(--b3));box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--line)}
.btn:hover::before{filter:brightness(1.07)}
.btn:active{transform:translateY(3px)}
.btn:active::before{box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 var(--line)}
.btn.yellow{--b1:var(--yellow-hi);--b2:var(--yellow);--b3:var(--yellow-dk)}
.btn.blue{--b1:var(--blue-hi);--b2:var(--blue);--b3:var(--blue-dk)}
.btn.red{--b1:var(--red-hi);--b2:var(--red);--b3:var(--red-dk)}
.btn.big{flex:1 1 160px;min-height:66px;font-size:26px;letter-spacing:.18em}
.btn.big::before{border-radius:12px;box-shadow:inset 0 4px 0 rgba(255,255,255,.5),0 6px 0 var(--line)}
.btn svg{width:32px;height:32px;color:#FFFFFF;filter:var(--icon-ol)}
.btn.small{min-height:36px;padding:3px 16px;font-size:13px}
.btn.small::before{border-width:2px;border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 var(--line)}
.link{background:none;border:none;padding:4px 2px;color:var(--muted);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:#FFFFFF}

.notice{margin:0;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(4,12,40,.6);color:#FFFFFF;font-size:14px;font-weight:500}

/* log */
.log{display:grid;gap:14px;min-width:0}
.log-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.log-head h2{margin:0;font-weight:900;font-size:26px;color:#FFFFFF;text-shadow:var(--ol3);transform:rotate(-1.5deg)}
.log-total{padding:2px 12px;border-radius:999px;border:2px solid var(--line);background:rgba(4,12,40,.6);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.panel.group{padding:4px 16px}
.group-title{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0;padding:10px 0;font-size:16px;font-weight:900;cursor:default}
summary.group-title{cursor:pointer;list-style-position:inside}
.group-n{font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;transform:skewX(-10deg);padding:0 10px;border:2px solid var(--line);background:var(--green);color:#FFFFFF;text-shadow:var(--ol1);font-size:12px;font-weight:900;line-height:20px}
.pill.wait{background:var(--yellow);color:var(--line);text-shadow:none}
.row{display:grid;grid-template-columns:6.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:2px solid rgba(255,255,255,.1)}
.row-date{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row-main{min-width:0}
.row-reason{font-weight:900;overflow-wrap:anywhere}
.row-who{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;font-size:13px;color:var(--muted)}
.row-who b{color:#FFFFFF;font-weight:900}
.sig-thumb{width:70px;height:28px;color:#FFFFFF;flex:none}
.row-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.redeem-row .row-reason{color:var(--yellow)}
.empty{margin:0;padding:12px 0;color:var(--muted);font-size:14px;font-weight:500}

.onboard{display:grid;gap:22px}
.intro h2{margin:0;font-weight:900;font-size:clamp(22px,6vw,28px);line-height:1.3;color:#FFFFFF;text-shadow:var(--ol3);text-wrap:balance}
.intro-body{padding:16px clamp(16px,4vw,22px) 22px;display:grid;gap:16px;justify-items:start}
.intro-body p{margin:0;color:var(--muted);font-weight:500;max-width:34em}
.loading{padding:22px}
.loading p{margin:0;font-weight:900;color:var(--muted)}

/* dialogs */
dialog{border:3px solid var(--line);padding:0;border-radius:18px;background:linear-gradient(var(--panel-2),var(--panel));color:#FFFFFF;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 6px 0 var(--line)}
dialog::backdrop{background:rgba(3,8,30,.68)}
.dlg{display:grid}
.dlg-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 10px 18px;border-bottom:3px solid var(--line);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 60%),var(--ink,var(--blue))}
.dlg-head h2{margin:0;font-weight:900;font-size:22px;line-height:1.3;color:#FFFFFF;text-shadow:var(--ol);overflow-wrap:anywhere}
.x{position:relative;isolation:isolate;width:44px;height:44px;flex:none;display:grid;place-items:center;border:none;background:none;color:#FFFFFF;text-shadow:var(--ol);font-size:24px;font-weight:900;line-height:1;cursor:pointer}
.x::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-9deg);border:3px solid var(--line);border-radius:9px;background:linear-gradient(var(--red-hi),var(--red) 55%,var(--red-dk));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 var(--line)}
.x:active{transform:translateY(2px)}
.dlg-body{display:grid;gap:16px;padding:16px 18px 22px}
.dlg-sub{margin:0;padding:8px 12px;border-radius:10px;border:2px solid var(--yellow);background:rgba(0,0,0,.3);color:var(--yellow);font-weight:900;font-size:16px}
.field{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.lbl{font-weight:900;font-size:15px;padding:0;color:#FFFFFF}
.lbl-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt{font-weight:500;color:var(--muted);font-size:12px;margin-left:8px}
.in{font:inherit;font-weight:700;color:#141824;background:#FFFFFF;border:3px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;min-height:48px}
.in::placeholder{color:#8C95A6;font-weight:500}
.in:focus-visible{outline:none;box-shadow:0 0 0 4px var(--yellow)}
.date-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:8px 12px;border-radius:10px;border:3px solid var(--line);background:#FFFFFF;color:#141824;font-variant-numeric:tabular-nums}
.date-row span{font-weight:900}
.date-row .link{color:#3A4C70}
.goal-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.goal-row .in{width:6.5em}
.chips{display:flex;flex-wrap:wrap;gap:12px 12px;padding:0 6px 3px}
.chip{position:relative;isolation:isolate;border:none;background:none;padding:5px 16px;min-height:40px;color:#FFFFFF;text-shadow:var(--ol);font-size:14px;font-weight:900;cursor:pointer}
.chip::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-9deg);border:3px solid var(--line);border-radius:8px;background:linear-gradient(var(--chip-hi),var(--chip) 55%,var(--chip-dk));box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 var(--line)}
.chip:active{transform:translateY(2px)}
.chip[aria-pressed="true"]::before{background:linear-gradient(var(--yellow-hi),var(--yellow) 55%,var(--yellow-dk))}
.pick{display:flex;flex-wrap:wrap;gap:14px 10px;padding-top:4px}
.pick-item{position:relative;display:grid;justify-items:center;gap:8px;width:60px;cursor:pointer;font-size:12px;font-weight:900;color:var(--muted)}
.pick-item input{position:absolute;opacity:0;width:1px;height:1px}
.pick-item .token{width:44px;height:44px}
.pick-item input:checked ~ .token{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),0 0 0 4px #FFFFFF,0 0 0 7px var(--line)}
.pick-item input:checked ~ .pick-label{color:#FFFFFF}
.pick-item input:focus-visible ~ .token{outline:3px dashed var(--yellow);outline-offset:9px}
.sigpad{position:relative;aspect-ratio:5/2;max-width:100%;border:3px solid var(--line);border-radius:12px;background:#FFFFFF;overflow:hidden}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sighint{position:absolute;inset:0;display:grid;place-items:center;color:#7A8290;font-size:14px;font-weight:700;pointer-events:none}
.sigline{position:absolute;left:8%;right:8%;bottom:24%;border-bottom:2px solid #D3D8E0;pointer-events:none}
.err{margin:0;padding:8px 12px;border-radius:10px;border:2px solid var(--red);background:rgba(255,71,71,.2);color:#FFD0CC;font-size:14px;font-weight:900}
.dlg-actions{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap;padding-inline:6px}
.dlg-actions .btn.yellow{min-width:8em}
.danger-zone{border-top:2px solid rgba(255,255,255,.12);padding-top:14px;display:grid;gap:10px;justify-items:start;padding-left:6px}
.danger-zone p{margin:0;font-size:14px;color:var(--muted)}
.danger-zone .row-act{justify-content:flex-start}

/* notification */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:min(380px,calc(100vw - 32px));padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:linear-gradient(var(--panel-2),var(--panel));color:#FFFFFF;box-shadow:0 5px 0 var(--line);transform:translateX(-50%);animation:pop .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.toast .token{width:40px;height:40px}
.toast-text{min-width:0}
.toast-title{font-weight:900;font-size:16px;line-height:1.35;color:var(--yellow);text-shadow:var(--ol)}
.toast-msg{font-size:13px;line-height:1.45;color:#FFFFFF;overflow-wrap:anywhere}
.toast button{background:none;border:none;color:var(--yellow);font-weight:900;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}

@media (max-width:420px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row-date{grid-column:1/-1;margin-bottom:-6px}
  .bcard{width:100px;height:136px}
}
@media (prefers-reduced-motion:reduce){
  .token.slam,.rays,.slot.next,.done-cta,.done-card::before,.toast{animation:none}
  .rays,.plus{display:none}
  .xp-fill,.bcard{transition:none}
}

<script>
/* ===== Firebase 設定：把 Firebase 主控台「網頁應用程式」的 firebaseConfig 貼在這裡 ===== */
const FIREBASE_CONFIG = null;
/* ===================================================================================== */

(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const SHAPES = [['star','星星'],['heart','愛心'],['flower','小花'],['sun','太陽'],['paw','腳印'],['great','棒']];
const INKS = [['red','紅'],['blue','藍'],['green','綠'],['purple','紫'],['orange','橘'],['pink','粉']];
const SHAPE_KEYS = SHAPES.map(s => s[0]);
const INK_KEYS = INKS.map(s => s[0]);
const DEFAULT_SIGNERS = ['爸爸','媽媽','老師','阿公','阿嬤'];
const DEFAULT_REASONS = ['自己收玩具','刷牙洗臉','寫完功課','幫忙做家事','早睡早起','吃完青菜'];
const WD = '日一二三四五六';
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[A-Za-z0-9_\-.~:@+]{1,150}$/;

function lsGet(k){ try { return localStorage.getItem('stampbook:' + k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem('stampbook:' + k, v); } catch (e) {} }

/* ---------- sound: an original arcade loop + effects, synthesized with Web Audio ---------- */
const Sound = (() => {
  const BPM = 132, STEP = 60 / BPM / 4;
  const ROOTS = [45, 41, 48, 43, 45, 41, 43, 40];
  const VOICE = [[57,60,64],[57,60,65],[55,60,64],[55,59,62],[57,60,64],[57,60,65],[55,59,62],[56,59,64]];
  const MEL = [
    [[0,76,2],[2,74,2],[4,72,2],[6,74,1],[7,76,3],[10,79,2],[12,76,4]],
    [[0,77,2],[2,76,2],[4,74,2],[6,72,2],[8,74,4],[12,69,2],[14,72,2]],
    [[0,72,2],[2,76,2],[4,79,3],[7,81,1],[8,79,2],[10,76,2],[12,79,4]],
    [[0,79,2],[2,77,1],[3,76,1],[4,74,4],[8,71,2],[10,74,2],[12,79,2],[14,74,2]],
    [[0,81,3],[3,79,1],[4,76,2],[6,79,2],[8,81,2],[10,84,2],[12,83,2],[14,81,2]],
    [[0,77,2],[2,81,2],[4,84,4],[8,81,2],[10,77,2],[12,76,2],[14,77,2]],
    [[0,79,2],[2,74,2],[4,71,2],[6,74,2],[8,79,2],[10,83,2],[12,86,4]],
    [[0,83,4],[4,80,2],[6,76,2],[8,80,2],[10,83,2],[12,76,4]]
  ];
  const BASS = [0, 0, 12, 0, 0, 12, 0, 7];
  const ARP = [0,1,2,3,2,1,0,1,2,3,2,1,0,1,2,3];
  let ctx = null, musicBus = null, sfxBus = null, echo = null, noiseBuf = null;
  let playing = false, timer = 0, nextTime = 0, step = 0, hiddenStop = false;
  let wantMusic = lsGet('music') === '1';
  let sfxOn = lsGet('sfx') !== '0';
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function ensure(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e){ return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 4;
      comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0; musicBus.connect(comp);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(comp);
      echo = ctx.createDelay(1); echo.delayTime.value = STEP * 3;
      const fb = ctx.createGain(); fb.gain.value = 0.3;
      const wet = ctx.createGain(); wet.gain.value = 0.3;
      echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(musicBus);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended'){ try { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    return ctx;
  }
  function tone(bus, type, freq, t, dur, vol, o){
    o = o || {};
    const osc = ctx.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + (o.slideT || dur));
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.a || 0.005));
    g.gain.exponentialRampToValueAtTime(vol * (o.s || 0.55), t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    if (o.echo) g.connect(echo);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function noise(bus, t, dur, vol, type, freq){
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }
  const kick = (b, t, v) => tone(b, 'sine', 160, t, 0.3, v, { slide: 42, slideT: 0.14, a: 0.002, s: 0.5 });
  const snare = (b, t, v) => { noise(b, t, 0.17, v, 'bandpass', 1900); tone(b, 'triangle', 200, t, 0.1, v * 0.6, { a: 0.002 }); };
  const hat = (b, t, v, open) => noise(b, t, open ? 0.15 : 0.04, v, 'highpass', 7500);

  function stepAt(n, t){
    const s = n % 16, bar = Math.floor(n / 16) % 8, pass = Math.floor(n / 128) % 2, B = musicBus;
    if (s === 0 || s === 8 || (s === 11 && bar % 2 === 1)) kick(B, t, 0.9);
    if (s === 4 || s === 12) snare(B, t, 0.35);
    if (bar === 7 && s >= 13) snare(B, t, 0.16 + (s - 13) * 0.06);
    if (s % 2 === 0) hat(B, t, s % 4 === 2 ? 0.1 : 0.05, s === 6 || s === 14);
    if (s % 2 === 0){
      const m = ROOTS[bar] + BASS[s / 2];
      tone(B, 'triangle', mtof(m), t, STEP * 1.7, 0.16, { a: 0.004, s: 0.6 });
      tone(B, 'square', mtof(m), t, STEP * 1.4, 0.05, { a: 0.004, lp: 650 });
    }
    if (s === 2 || s === 6 || s === 10 || s === 14) for (const m of VOICE[bar]) tone(B, 'sawtooth', mtof(m + 12), t, STEP * 1.3, 0.022, { a: 0.003, lp: 2200, s: 0.4 });
    if (pass === 0){
      for (const [st, m, len] of MEL[bar]) if (st === s) tone(B, 'square', mtof(m), t, STEP * len * 0.95, 0.06, { a: 0.006, lp: 3400, s: 0.7, echo: true });
    } else {
      const v = VOICE[bar], notes = [v[0] + 12, v[1] + 12, v[2] + 12, v[0] + 24];
      tone(B, 'square', mtof(notes[ARP[s]]), t, STEP * 0.9, 0.035, { a: 0.003, lp: 2600, s: 0.5, echo: true });
      if (s === 0) tone(B, 'triangle', mtof(MEL[bar][0][1]), t, STEP * 8, 0.07, { a: 0.02, s: 0.8, echo: true });
    }
  }
  function tick(){ if (!playing) return; while (nextTime < ctx.currentTime + 0.12){ stepAt(step, nextTime); nextTime += STEP; step++; } }
  function start(){
    if (playing || !ensure()) return;
    playing = true;
    const t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(0.0001, t); musicBus.gain.linearRampToValueAtTime(0.5, t + 0.4);
    nextTime = t + 0.08; step = 0;
    clearInterval(timer); timer = setInterval(tick, 25); tick();
  }
  function stop(){
    playing = false; clearInterval(timer); timer = 0;
    if (ctx){ const t = ctx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(0, t + 0.2); }
  }
  const SFX = {
    tap(t){ tone(sfxBus, 'square', 660, t, 0.07, 0.05, { slide: 990, a: 0.002, lp: 3000 }); },
    stamp(t){
      tone(sfxBus, 'sine', 200, t, 0.35, 0.9, { slide: 45, slideT: 0.18, a: 0.002 });
      noise(sfxBus, t, 0.14, 0.45, 'bandpass', 1100);
      tone(sfxBus, 'square', mtof(83), t + 0.3, 0.09, 0.08, { a: 0.003, lp: 4000, s: 0.8 });
      tone(sfxBus, 'square', mtof(88), t + 0.38, 0.35, 0.08, { a: 0.003, lp: 4000, s: 0.6 });
    },
    full(t){
      [72, 76, 79, 84].forEach((m, i) => tone(sfxBus, 'square', mtof(m), t + i * 0.09, 0.16, 0.07, { a: 0.003, lp: 3600 }));
      [84, 88, 91].forEach(m => tone(sfxBus, 'sawtooth', mtof(m), t + 0.36, 0.7, 0.035, { a: 0.01, lp: 3000, s: 0.7 }));
      noise(sfxBus, t + 0.36, 0.6, 0.12, 'highpass', 6000);
    },
    redeem(t){
      for (let i = 0; i < 8; i++) snare(sfxBus, t + i * 0.055, 0.12 + i * 0.03);
      const t2 = t + 0.45;
      [67, 72, 76, 79, 84].forEach((m, i) => tone(sfxBus, 'square', mtof(m), t2 + i * 0.08, 0.15, 0.07, { a: 0.003, lp: 3600 }));
      kick(sfxBus, t2 + 0.42, 0.9);
      [72, 76, 79, 84].forEach(m => tone(sfxBus, 'sawtooth', mtof(m + 12), t2 + 0.42, 1.1, 0.03, { a: 0.01, lp: 3200, s: 0.75 }));
      noise(sfxBus, t2 + 0.42, 1.2, 0.18, 'highpass', 5000);
    },
    undo(t){ tone(sfxBus, 'triangle', 520, t, 0.16, 0.09, { slide: 260, a: 0.003 }); }
  };
  function play(name, delay){
    if (!sfxOn || !SFX[name] || !ensure()) return;
    try { SFX[name](ctx.currentTime + 0.02 + (delay || 0)); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ if (playing){ hiddenStop = true; stop(); } }
    else if (hiddenStop){ hiddenStop = false; if (wantMusic) start(); }
  });
  document.addEventListener('pointerdown', () => {
    if (sfxOn || wantMusic) ensure();
    if (wantMusic && !playing && !document.hidden) start();
  }, true);
  return {
    get music(){ return wantMusic; },
    get sfx(){ return sfxOn; },
    toggleMusic(){ wantMusic = !wantMusic; lsSet('music', wantMusic ? '1' : '0'); if (wantMusic) start(); else stop(); },
    toggleSfx(){ sfxOn = !sfxOn; lsSet('sfx', sfxOn ? '1' : '0'); if (sfxOn) play('tap'); },
    prime(){ if (sfxOn || wantMusic) ensure(); },
    play
  };
})();

const S = {
  mode: 'loading', kids: [], stamps: [], redeems: [],
  ready: { kids: false, stamps: false }, canWrite: true, subError: false,
  kidId: lsGet('kid'), sel: null, thunk: null, thunkDone: true, confirm: null, pending: 0,
  openCards: new Set()

let db = null;

/* ---------- helpers ---------- */
const pad2 = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function dateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function parts(s){ const [y, m, d] = s.split('-').map(Number); return { y, m, d, wd: WD[new Date(y, m - 1, d).getDay()] }; }
function fmtShort(s){ const p = parts(s); return p.m + '/' + p.d; }
function fmtLong(s){ const p = parts(s); return p.y + '/' + pad2(p.m) + '/' + pad2(p.d) + '（' + p.wd + '）'; }
function fmtRow(s){ const p = parts(s); const y = p.y === new Date().getFullYear() ? '' : p.y + '/'; return y + pad2(p.m) + '/' + pad2(p.d) + '（' + p.wd + '）'; }
const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
const num = v => typeof v === 'number' && isFinite(v) ? v : 0;
function clampInt(v, lo, hi, dflt){ const n = Math.round(Number(v)); return Number.isFinite(n) && v !== null && v !== '' ? Math.min(hi, Math.max(lo, n)) : dflt; }
const validSig = p => typeof p === 'string' && p.length > 0 && p.length < 40000 && /^[ML0-9. ]+$/.test(p);
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt;
function hash(s){ let x = 2166136261; for (let i = 0; i < s.length; i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
const rot = id => (hash(id) % 13) - 6;
function pickCols(n){ if (n <= 7) return n; return [7, 5, 4, 6, 3].find(c => n % c === 0) || 5; }
function miniCols(n){ if (n <= 10) return n; return [7, 5, 6, 4].find(x => n % x === 0) || 7; }

function normKid(id, d){
  return { id, name: str(d.name, 20) || '小朋友', goal: clampInt(d.goal, 3, 100, 14), reward: str(d.reward, 40),
    shape: SHAPE_KEYS.includes(d.shape) ? d.shape : 'star', ink: INK_KEYS.includes(d.ink) ? d.ink : 'red',
    card: clampInt(d.card, 1, 9999, 1), createdAt: num(d.createdAt) };
}
function normStamp(id, d){
  return { id, kidId: str(d.kidId, 120), card: clampInt(d.card, 1, 9999, 1), date: DATE_RE.test(d.date) ? d.date : '2000-01-01',
    reason: str(d.reason, 60), signer: str(d.signer, 20), sig: validSig(d.sig) ? d.sig : '', createdAt: num(d.createdAt) };
}
function normRedeem(id, d){
  return { id, kidId: str(d.kidId, 120), card: clampInt(d.card, 1, 9999, 1), reward: str(d.reward, 40),
    date: DATE_RE.test(d.date) ? d.date : '2000-01-01', signer: str(d.signer, 20), sig: validSig(d.sig) ? d.sig : '', createdAt: num(d.createdAt) };
}
const NORM = { kids: normKid, stamps: normStamp, redeems: normRedeem };

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const nodes = arr => arr.filter(Boolean);
function icon(name){
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u); return s;
}
const shapeIcon = shape => icon(SHAPE_KEYS.includes(shape) ? shape : 'star');
function block(shape, cls, style){
  return h('span', { class: 'token' + (cls ? ' ' + cls : ''), style: style || null, 'aria-hidden': 'true' }, shape ? shapeIcon(shape) : null);
}
function sigSvg(path, cls){
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 300 120'); s.setAttribute('class', cls);
  s.setAttribute('role', 'img'); s.setAttribute('aria-label', '手寫簽名');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', path); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor');
  p.setAttribute('stroke-width', '3.2'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
  s.append(p); return s;
}
const inkVar = k => 'var(--ink-' + (INK_KEYS.includes(k) ? k : 'red') + ')';

/* Cards fill in order: once the newest card holds `goal` stamps, the next stamp starts a new card. */
function kidCards(kid){
  const mine = S.stamps.filter(s => s.kidId === kid.id);
  const map = new Map();
  for (const s of mine){ if (!map.has(s.card)) map.set(s.card, []); map.get(s.card).push(s); }
  for (const arr of map.values()) arr.sort(byDate);
  let max = kid.card;
  for (const c of map.keys()) if (c > max) max = c;
  const current = (map.get(max) || []).length >= kid.goal ? max + 1 : max;
  const on = c => map.get(c) || [];
  const redeemOf = c => S.redeems.find(r => r.kidId === kid.id && r.card === c) || null;
  const past = [...map.keys()].filter(c => c < current).sort((a, b) => a - b);
  const redeemable = past.filter(c => on(c).length >= kid.goal && !redeemOf(c));
  return { all: mine, current, on, redeemOf, past, redeemable };
}

/* ---------- notification ---------- */
const TOAST_KIND = {
  ok:   { ink: 'var(--yellow)', icon: 'star' },
  win:  { ink: 'var(--purple)', icon: 'trophy' },
  info: { ink: 'var(--blue)', icon: 'star' },
  warn: { ink: 'var(--red)', icon: 'alert' }
};
let toastTimer = 0;
function hideToast(){ $('#toast').hidden = true; }
function toast(msg, action, opt){
  opt = opt || {};
  const k = TOAST_KIND[opt.kind] || TOAST_KIND.info;
  const t = $('#toast');
  t.hidden = true;
  t.replaceChildren(...nodes([
    h('span', { class: 'token', style: '--ink:' + k.ink + ';--rot:-6deg', 'aria-hidden': 'true' }, icon(k.icon)),
    h('div', { class: 'toast-text' }, opt.title ? h('div', { class: 'toast-title' }, opt.title) : null, h('div', { class: opt.title ? 'toast-msg' : 'toast-title' }, msg)),
    action ? h('button', { type: 'button', onclick: () => { hideToast(); action.fn(); } }, action.label) : null]));
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, action ? 6000 : 3500);
}

/* ---------- data layer ---------- */
function status(){
  const el = $('#status'); let t, k;
  if (S.mode === 'loading'){ t = '連線中…'; k = 'wait'; }
  else if (S.mode === 'local'){ t = (!FIREBASE_CONFIG && localOk) ? '存在這台裝置' : '沒有保存'; k = (!FIREBASE_CONFIG && localOk) ? 'ok' : 'warn'; }
  else if (S.mode === 'signin'){ t = '請先登入'; k = 'wait'; }
  else if (S.mode === 'denied'){ t = '沒有權限'; k = 'warn'; }
  else if (!S.canWrite){ t = '只能查看'; k = 'wait'; }
  else if (!navigator.onLine){ t = '離線中，連上網路後會同步'; k = 'wait'; }
  else if (S.pending){ t = '儲存中…'; k = 'wait'; }
  else { t = '已同步'; k = 'ok'; }
  el.dataset.k = k; el.lastElementChild.textContent = t;
}
window.addEventListener('online', () => status());
window.addEventListener('offline', () => status());
function handleErr(e){
  const c = e && e.code;
  const warn = { kind: 'warn' };
  if (c === 'permission-denied'){ S.canWrite = false; render(); toast('這個帳號沒有修改權限', null, warn); }
  else if (c === 'resource-exhausted') toast('雲端用量到上限了，請明天再試', null, warn);
  else if (c === 'unauthenticated'){ toast('登入過期了，請重新登入', null, warn); }
  else toast('沒有存成功，請再試一次', null, warn);
}
async function op(fn){
  S.pending++; status();
  try {
    try { await fn(); }
    catch (e){ if (!e || e.code !== 'unavailable') throw e; await sleep(400 + Math.random() * 700); await fn(); }
    return true;
  } catch (e){ handleErr(e); return false; }
  finally { S.pending--; status(); }
}
/* Without Firebase, records are kept on this device only (browser storage). */
const LOCAL_KEY = 'stampbook:data';
let localOk = false;
function saveLocal(){
  if (FIREBASE_CONFIG) return;
  const strip = arr => Object.fromEntries(arr.map(({ id, ...rest }) => [id, rest]));
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ kids: strip(S.kids), stamps: strip(S.stamps), redeems: strip(S.redeems) })); localOk = true; }
  catch (e){ localOk = false; }
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    localOk = true;
    if (!raw) return;
    const d = JSON.parse(raw) || {};
    for (const col of ['kids', 'stamps', 'redeems']) S[col] = Object.entries(d[col] || {}).filter(([id]) => ID_RE.test(id)).map(([id, body]) => NORM[col](id, body || {}));
    S.kids.sort((a, b) => a.createdAt - b.createdAt);
  } catch (e){ localOk = false; }
}
const api = {
  mint(col){ return S.mode === 'db' ? db.collection(col).doc().id : 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  put(col, id, data){
    if (S.mode === 'db') return op(() => db.collection(col).doc(id).set(data));
    const arr = S[col], n = NORM[col](id, data), i = arr.findIndex(x => x.id === id);
    if (i >= 0) arr[i] = n; else arr.push(n);
    if (col === 'kids') S.kids.sort((a, b) => a.createdAt - b.createdAt);
    saveLocal(); render(); return Promise.resolve(true);
  },
  patch(col, id, data){
    if (S.mode === 'db') return op(() => db.collection(col).doc(id).update(data));
    const arr = S[col], i = arr.findIndex(x => x.id === id);
    if (i >= 0) arr[i] = NORM[col](id, Object.assign({}, arr[i], data));
    saveLocal(); render(); return Promise.resolve(true);
  },
  del(col, id){
    if (S.mode === 'db') return op(() => db.collection(col).doc(id).delete());
    S[col] = S[col].filter(x => x.id !== id);
    saveLocal(); render(); return Promise.resolve(true);
  }
};

/* ---------- rendering ---------- */
let raf = 0;
function render(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
const notice = text => h('p', { class: 'notice', role: 'status' }, text);

function draw(){
  status();
  const roster = $('#roster'), view = $('#view');
  drawSettings();
  if (S.mode === 'signin' || S.mode === 'denied'){
    roster.hidden = true; view.style.removeProperty('--ink');
    view.replaceChildren(signinView());
    return;
  }
  if (!(S.ready.kids && S.ready.stamps)){
    roster.hidden = true;
    view.replaceChildren(h('section', { class: 'panel loading' }, h('p', null, '載入中…')));
    return;
  }
  const notes = nodes([
    S.mode === 'local' ? notice(FIREBASE_CONFIG ? '雲端服務載入失敗，請檢查網路後重新整理。現在新增的紀錄不會保存。'
      : localOk ? '目前紀錄只存在這台裝置上，還不會同步到其他手機。'
      : '這個瀏覽器不能存資料（可能是無痕模式），重新整理後紀錄會消失。') : null,
    S.subError ? notice('讀取紀錄時出了問題，請重新整理頁面。') : null,
    !S.canWrite ? notice('你目前只能查看這本集點本，沒辦法蓋章或修改。') : null
  ]);
  if (!S.kids.length){
    roster.hidden = true; view.style.removeProperty('--ink');
    view.replaceChildren(...notes, onboarding());
    return;
  }
  const kid = S.kids.find(k => k.id === S.kidId) || S.kids[0];
  S.kidId = kid.id;
  roster.hidden = false;
  roster.replaceChildren(...nodes([
    ...S.kids.map(k => rosterCard(k, k.id === kid.id)),
    S.canWrite ? h('button', { class: 'bcard add', type: 'button', onclick: () => openKid(null) }, h('span', { class: 'bcard-plus', 'aria-hidden': 'true' }, '+'), h('span', null, '新增小朋友')) : null]));
  view.style.setProperty('--ink', inkVar(kid.ink));
  const info = kidCards(kid);
  view.replaceChildren(...notes,
    ...info.redeemable.map(c => doneCard(kid, c, info.on(c))),
    ...nodes([cardView(kid, { stamps: info.on(info.current), card: info.current }), actionsView(kid), logView(kid, info)]));
}

function rosterCard(k, active){

function xpBar(count, goal){

function cardView(kid, opts){
  opts = opts || {};
  const sample = !!opts.sample;
  const stamps = opts.stamps || [];
  const goal = kid.goal, count = stamps.length, n = Math.max(goal, count);
  const grid = h('div', { class: 'grid', style: '--cols:' + pickCols(n) });
  let selIdx = -1;
  for (let i = 0; i < n; i++){
    const s = stamps[i];
    if (s){
      const isSel = !sample && S.sel === s.id;
      if (isSel) selIdx = i;
      let drop = false;
      if (!sample && S.thunk === s.id && !S.thunkDone){ drop = true; S.thunkDone = true; }
      const kids = [drop ? h('span', { class: 'rays', 'aria-hidden': 'true' }) : null,
        block(kid.shape, drop ? 'slam' : '', '--rot:' + rot(s.id) + 'deg'),

/* signature pad */
const sigPad = (() => {
  const cv = $('#sigcanvas'), hint = $('#sighint');
  const W = 300, H = 120, MAX = 2500, INK = '#141824';
  let strokes = [], cur = null, total = 0;
  function paint(){
    const ctx = cv.getContext('2d'); if (!ctx) return;
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3.2; ctx.strokeStyle = INK;
    for (const s of strokes){
      ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]);
      if (s.length === 1) ctx.lineTo(s[0][0] + 0.01, s[0][1]);
      for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
      ctx.stroke();
    }
    hint.hidden = strokes.length > 0;
  }
  function size(){ const r = cv.getBoundingClientRect(); if (!r.width) return; const dpr = window.devicePixelRatio || 1; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); paint(); }
  function pt(e){
    const r = cv.getBoundingClientRect();
    const x = Math.min(W, Math.max(0, (e.clientX - r.left) / r.width * W));
    const y = Math.min(H, Math.max(0, (e.clientY - r.top) / r.height * H));
    return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
  }
  cv.addEventListener('pointerdown', e => {
    if (total >= MAX) return; e.preventDefault(); $('#stamp-err').hidden = true;
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    cur = [pt(e)]; strokes.push(cur); total++; paint();
  });
  cv.addEventListener('pointermove', e => {
    if (!cur || total >= MAX) return;
    const p = pt(e), l = cur[cur.length - 1];
    if (Math.hypot(p[0] - l[0], p[1] - l[1]) < 1.5) return;
    cur.push(p); total++; paint();
  });
  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  if (typeof ResizeObserver === 'function') new ResizeObserver(size).observe(cv);
  return {
    clear(){ strokes = []; total = 0; cur = null; size(); paint(); },
    path(){
      return strokes.map(s => { const p = s.length === 1 ? [s[0], s[0]] : s; return 'M' + p[0][0] + ' ' + p[0][1] + p.slice(1).map(q => 'L' + q[0] + ' ' + q[1]).join(''); }).join('');
    }
  };
})();

let stampKid = null, signMode = 'stamp', redeemCard = 0, signerSel = '';
function syncPressed(boxSel, value){ for (const b of $(boxSel).children) b.setAttribute('aria-pressed', b.dataset.v === value ? 'true' : 'false'); }
function openStamp(kid){ openSign('stamp', kid, 0); }
function openRedeem(kid, c){ openSign('redeem', kid, c); }
function openSign(mode, kid, card){
  Sound.play('tap');
  stampKid = kid; signMode = mode; redeemCard = card;
  const isR = mode === 'redeem';
  $('#stamp-dlg').style.setProperty('--ink', isR ? 'var(--purple)' : inkVar(kid.ink));
  $('#stamp-dlg-title').textContent = isR ? '兌換第 ' + card + ' 張集點卡' : '幫 ' + kid.name + ' 蓋章';
  $('#dlg-sub').hidden = !isR;
  $('#dlg-sub').textContent = isR ? kid.name + ' 集滿 ' + kid.goal + ' 點了！' + (kid.reward ? '獎勵：' + kid.reward : '') : '';
  $('#reason-field').hidden = isR;
  $('#date-lbl').textContent = isR ? '兌換日期' : '日期';
  $('#signer-lbl').textContent = isR ? '誰兌換' : '誰簽名';
  $('#stamp-submit').textContent = isR ? '確認兌換' : '蓋章';
  $('#st-date').value = todayStr();
  $('#st-date').hidden = true;
  $('#st-date-row').hidden = false;
  $('#st-date-text').textContent = '今天・' + fmtLong(todayStr());
  $('#st-reason').value = '';
  $('#st-signer').value = '';
  $('#st-signer').hidden = true;
  signerSel = '';
  const recent = [];
  for (const s of S.stamps){ if (s.kidId === kid.id && s.reason && !recent.includes(s.reason)) recent.push(s.reason); if (recent.length >= 4) break; }
  const reasons = recent.concat(DEFAULT_REASONS.filter(r => !recent.includes(r))).slice(0, 8);
  $('#reason-chips').replaceChildren(...reasons.map(r => h('button', { type: 'button', class: 'chip', 'data-v': r, 'aria-pressed': 'false',
    onclick: () => { $('#st-reason').value = r; syncPressed('#reason-chips', r); } }, r)));
  const past = [];
  for (const s of S.stamps){ if (s.signer && !DEFAULT_SIGNERS.includes(s.signer) && !past.includes(s.signer)) past.push(s.signer); if (past.length >= 4) break; }
  $('#signer-chips').replaceChildren(...DEFAULT_SIGNERS.concat(past).map(n => h('button', { type: 'button', class: 'chip', 'data-v': n, 'aria-pressed': 'false',
    onclick: () => setSigner(n) }, n)),
    h('button', { type: 'button', class: 'chip', 'data-v': '__other', 'aria-pressed': 'false', onclick: () => setSigner('__other') }, '其他…'));
  $('#stamp-err').hidden = true;
  openDlg($('#stamp-dlg'));
  sigPad.clear();
}
function setSigner(v){
  signerSel = signerSel === v ? '' : v;
  syncPressed('#signer-chips', signerSel);
  const other = signerSel === '__other';
  $('#st-signer').hidden = !other;
  if (other) $('#st-signer').focus();
  $('#stamp-err').hidden = true;
}
function currentSigner(){ return signerSel === '__other' ? $('#st-signer').value.trim().slice(0, 20) : signerSel; }
$('#st-date-edit').addEventListener('click', () => {
  const inp = $('#st-date');
  $('#st-date-row').hidden = true; inp.hidden = false; inp.focus();
  try { if (typeof inp.showPicker === 'function') inp.showPicker(); } catch (e) {}
});

$('#stamp-form').addEventListener('submit', async e => {
  e.preventDefault();
  Sound.prime();
  const kid = (stampKid && S.kids.find(k => k.id === stampKid.id)) || stampKid;
  if (!kid) return;
  const date = DATE_RE.test($('#st-date').value) ? $('#st-date').value : todayStr();
  const signer = currentSigner();
  const sig = sigPad.path();
  const hasSig = validSig(sig);
  if (!signer && !hasSig){
    const who = signMode === 'redeem' ? '兌換的人' : '簽名的人';
    showErr('#stamp-err', signerSel === '__other' ? '請輸入' + who + '，或在上面手寫簽名' : '請點一位' + who + '，或在上面手寫簽名');
    if (signerSel === '__other') $('#st-signer').focus();
    return;
  }
  if (signMode === 'redeem'){
    const c = redeemCard;
    closeDlg($('#stamp-dlg'));
    if (kidCards(kid).redeemOf(c)){ toast('第 ' + c + ' 張已經兌換過了'); return; }
    const rid = ID_RE.test('r-' + kid.id + '-' + c) ? 'r-' + kid.id + '-' + c : api.mint('redeems');
    const body = { kidId: kid.id, card: c, reward: kid.reward, date, signer, sig: hasSig ? sig : '', createdAt: Date.now() };
    if (await api.put('redeems', rid, body)){ Sound.play('redeem'); } else return;
    toast(kid.reward ? '獎勵：' + kid.reward : '第 ' + c + ' 張集點卡已兌換', { label: '復原', fn: () => api.del('redeems', rid) }, { title: '兌換成功！', kind: 'win' });
    return;
  }
  const reason = $('#st-reason').value.trim().slice(0, 60);
  const info = kidCards(kid);
  const card = info.current;
  const nth = info.on(card).length + 1;
  const data = { kidId: kid.id, card, date, reason, signer, sig: hasSig ? sig : '', createdAt: Date.now() };
  const id = api.mint('stamps');
  closeDlg($('#stamp-dlg'));
  S.thunk = id; S.thunkDone = false; S.sel = null; S.kidId = kid.id;
  const full = nth >= kid.goal;
  const ok = await api.put('stamps', id, data);
  if (ok){ Sound.play('stamp'); if (full) Sound.play('full', 0.75); }
  if (ok) toast(full ? '按上面紫色的集點卡就能兌換' : kid.name + ' 第 ' + nth + ' 點' + (reason ? '・' + reason : ''),
    { label: '復原', fn: () => api.del('stamps', id) },
    { title: full ? '第 ' + card + ' 張集滿了！' : '+1 點！', kind: full ? 'win' : 'ok' });
});

  const g = Number($('#kid-goal').value);
  if (!Number.isInteger(g) || g < 3 || g > 100){ showErr('#kid-err', '集滿點數請填 3 到 100 之間的整數'); $('#kid-goal').focus(); return; }
  const data = { name, goal: g, reward: $('#kid-reward').value.trim().slice(0, 40), shape: radio('shape') || 'star', ink: radio('ink') || 'red' };
  closeDlg($('#kid-dlg'));
  if (editingKid){
    if (await api.patch('kids', editingKid.id, data)) toast('已儲存', null, { kind: 'ok' });
  } else {
    const id = api.mint('kids');
    S.kidId = id; S.sel = null; lsSet('kid', id);
    if (await api.put('kids', id, Object.assign(data, { card: 1, createdAt: Date.now() }))){ Sound.play('full'); toast(name + ' 加入了！', null, { kind: 'ok' }); }
  }
});
$('#kid-del').addEventListener('click', () => {
  if (!editingKid) return;
  const n = S.stamps.filter(s => s.kidId === editingKid.id).length;
  $('#kid-del-msg').textContent = (n ? '會連同 ' + n + ' 筆蓋章紀錄一起刪掉，' : '') + '刪除後找不回來。';
  $('#kid-del').hidden = true; $('#kid-del-confirm').hidden = false;
});
$('#kid-del-no').addEventListener('click', () => { $('#kid-del').hidden = false; $('#kid-del-confirm').hidden = true; });
$('#kid-del-yes').addEventListener('click', async () => {
  const kid = editingKid; if (!kid) return;
  closeDlg($('#kid-dlg'));
  for (const s of S.stamps.filter(x => x.kidId === kid.id)) if (!await api.del('stamps', s.id)) return;
  for (const r of S.redeems.filter(x => x.kidId === kid.id)) if (!await api.del('redeems', r.id)) return;
  if (await api.del('kids', kid.id)) toast('已刪除' + kid.name + '的集點卡');
});

/* sound buttons */
function syncSoundBtns(){
  const m = $('#music-btn'), f = $('#sfx-btn');
  m.setAttribute('aria-pressed', Sound.music ? 'true' : 'false');
  m.lastElementChild.textContent = '音樂 ' + (Sound.music ? '開' : '關');
  f.setAttribute('aria-pressed', Sound.sfx ? 'true' : 'false');
  f.lastElementChild.textContent = '音效 ' + (Sound.sfx ? '開' : '關');
}
$('#music-btn').addEventListener('click', () => { Sound.toggleMusic(); syncSoundBtns(); });
$('#sfx-btn').addEventListener('click', () => { Sound.toggleSfx(); syncSoundBtns(); });
syncSoundBtns();

/* ---------- account ---------- */
let auth = null, user = null, unsubs = [];
const bigBtnStyle = 'flex:none;letter-spacing:.06em;margin-left:6px';
function signinView(){
  const denied = S.mode === 'denied';
  return h('section', { class: 'panel intro signin', style: '--ink:var(--purple)' },
    h('div', { class: 'ribbon' }, h('h2', null, denied ? '這個帳號沒有權限' : '家長登入')),
    h('div', { class: 'intro-body' },
      denied
        ? h('p', null, '目前登入的是 ', h('span', { class: 'who' }, (user && user.email) || '這個帳號'), '，不在允許名單裡。請登出後換成家長的 Google 帳號。')
        : h('p', null, '登入後才能看到和修改集點本。只有加進名單的家長 Google 帳號可以使用。'),
      S.authErr ? h('p', { class: 'err' }, S.authErr) : null,
      denied
        ? h('button', { class: 'btn yellow big', type: 'button', style: bigBtnStyle, onclick: () => auth.signOut().catch(() => {}) }, '登出，換帳號')
        : h('button', { class: 'btn yellow big', type: 'button', style: bigBtnStyle, onclick: signIn }, '用 Google 帳號登入')));
}
async function signIn(){
  Sound.play('tap');
  S.authErr = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await auth.signInWithPopup(provider); }
  catch (e){
    const c = e && e.code;
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment'){
      try { await auth.signInWithRedirect(provider); return; } catch (e2) {}
    }
    S.authErr = c === 'auth/unauthorized-domain' ? '這個網址還沒加進 Firebase 的「授權網域」。'
      : c === 'auth/operation-not-allowed' ? 'Firebase 還沒開啟 Google 登入。'
      : c === 'auth/network-request-failed' ? '網路連線失敗，請稍後再試。'
      : '登入失敗。請用 Safari 或 Chrome 打開這個網址再試一次（LINE 裡開的網頁不能用 Google 登入）。';
    render();
  }
}
$('#signout').addEventListener('click', () => { if (auth) auth.signOut().catch(() => {}); });

function drawSettings(){
  const box = $('#settings');
  const show = S.mode === 'db' || S.mode === 'local';
  box.hidden = !show;
  if (!show) return;
  $('#acct').replaceChildren(...(user ? ['登入帳號：', h('b', null, user.email || '')] : ['還沒連上雲端']));
  $('#signout').hidden = !user;
  $('#import-btn').hidden = !S.canWrite;
}

/* ---------- backup ---------- */
function exportData(){
  const pick = (arr, keys) => Object.fromEntries(arr.map(x => [x.id, Object.fromEntries(keys.map(k => [k, x[k]]))]));
  const data = { app: 'stamp-book', version: 1, exportedAt: new Date().toISOString(),
    kids: pick(S.kids, ['name', 'goal', 'reward', 'shape', 'ink', 'card', 'createdAt']),
    stamps: pick(S.stamps, ['kidId', 'card', 'date', 'reason', 'signer', 'sig', 'createdAt']),
    redeems: pick(S.redeems, ['kidId', 'card', 'reward', 'date', 'signer', 'sig', 'createdAt']) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  const a = h('a', { href: url, download: '集點本備份-' + todayStr() + '.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('備份檔已下載', null, { kind: 'ok' });
}
let pendingImport = null;
$('#export-btn').addEventListener('click', exportData);
$('#import-btn').addEventListener('click', () => { $('#import-file').value = ''; $('#import-file').click(); });
$('#import-file').addEventListener('change', () => {
  const f = $('#import-file').files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d = null;
    try { d = JSON.parse(r.result); } catch (e) {}
    if (!d || d.app !== 'stamp-book' || typeof d.kids !== 'object'){ toast('這不是集點本的備份檔', null, { kind: 'warn' }); return; }
    const clean = {};
    for (const col of ['kids', 'stamps', 'redeems']){
      clean[col] = [];
      for (const [id, body] of Object.entries(d[col] || {})){
        if (!ID_RE.test(id) || !body || typeof body !== 'object') continue;
        const { id: _drop, ...rest } = NORM[col](id, body);
        clean[col].push([id, rest]);
      }
    }
    pendingImport = clean;
    $('#import-msg').textContent = '要匯入 ' + clean.kids.length + ' 位小朋友、' + clean.stamps.length + ' 個章、' + clean.redeems.length + ' 次兌換嗎？相同的紀錄會用備份檔的內容蓋過。';
    $('#import-confirm').hidden = false;
  };
  r.onerror = () => toast('讀不到這個檔案', null, { kind: 'warn' });
  r.readAsText(f);
});
$('#import-no').addEventListener('click', () => { pendingImport = null; $('#import-confirm').hidden = true; });
$('#import-yes').addEventListener('click', async () => {
  const p = pendingImport; pendingImport = null; $('#import-confirm').hidden = true;
  if (!p) return;
  const writes = [];
  for (const col of ['kids', 'stamps', 'redeems']) for (const [id, body] of p[col]) writes.push([col, id, body]);
  if (S.mode === 'db'){
    for (let i = 0; i < writes.length; i += 400){
      const chunk = writes.slice(i, i + 400);
      const ok = await op(() => { const b = db.batch(); for (const [col, id, body] of chunk) b.set(db.collection(col).doc(id), body); return b.commit(); });
      if (!ok) return;
    }
  } else {
    for (const [col, id, body] of writes) api.put(col, id, body);
  }
  Sound.play('full');
  toast('匯入了 ' + writes.length + ' 筆紀錄', null, { title: '匯入完成！', kind: 'ok' });
});

/* ---------- boot ---------- */
function stopSubs(){ for (const f of unsubs){ try { f(); } catch (e) {} } unsubs = []; }
function subscribe(){
  const onErr = e => {
    if (e && e.code === 'permission-denied'){ stopSubs(); S.mode = 'denied'; render(); return; }
    S.subError = true; S.ready.kids = S.ready.stamps = true; render();
  };
  unsubs.push(db.collection('kids').onSnapshot(snap => {
    S.kids = snap.docs.map(d => normKid(d.id, d.data() || {})).sort((a, b) => a.createdAt - b.createdAt);
    S.ready.kids = true; render();
  }, onErr));
  unsubs.push(db.collection('stamps').orderBy('createdAt', 'desc').limit(1000).onSnapshot(snap => {
    S.stamps = snap.docs.map(d => normStamp(d.id, d.data() || {}));
    S.ready.stamps = true; render();
  }, onErr));
  unsubs.push(db.collection('redeems').onSnapshot(snap => {
    S.redeems = snap.docs.map(d => normRedeem(d.id, d.data() || {})); render();
  }, onErr));
}
function boot(){
  status();
  if (!FIREBASE_CONFIG || !window.firebase){
    if (!FIREBASE_CONFIG) loadLocal();
    S.mode = 'local'; S.ready.kids = S.ready.stamps = true; draw(); return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  } catch (e){ S.mode = 'local'; S.ready.kids = S.ready.stamps = true; draw(); return; }
  auth.getRedirectResult().catch(() => { S.authErr = '登入失敗，請再試一次。'; render(); });
  auth.onAuthStateChanged(u => {
    user = u; stopSubs();
    S.kids = []; S.stamps = []; S.redeems = [];
    S.ready.kids = S.ready.stamps = false; S.subError = false; S.canWrite = true; S.sel = null; S.confirm = null;
    if (!u){ S.mode = 'signin'; render(); return; }
    S.mode = 'db'; S.authErr = ''; render();
    subscribe();
  });
}
boot();
})();
</script>
</body>
</html>
